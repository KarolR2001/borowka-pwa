<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f7a4f" />
    <title>Borowka PWA offline</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #173129;
        background: #f7faf7;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(520px, calc(100% - 32px));
        border: 1px solid #dce6df;
        border-radius: 8px;
        padding: 24px;
        background: #ffffff;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #4f6258;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brak polaczenia</h1>
      <p>Aplikacja uruchomi sie po odswiezeniu albo odzyskaniu zasiegu.</p>
    </main>
  </body>
</html>
