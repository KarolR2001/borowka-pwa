name: Deploy Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FIREBASE_DEV_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_DEV_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_DEV_SERVICE_ACCOUNT_JSON }}
      VITE_APP_ENV: development
      VITE_USE_FIREBASE_EMULATORS: "false"
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_DEV_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_DEV_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_DEV_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_DEV_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_DEV_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_DEV_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Setup Java for Firebase CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate deploy environment
        run: node scripts/validate-deploy-env.mjs development

      - name: Prepare Firebase credentials
        shell: bash
        run: |
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${credentials_file}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "${GITHUB_ENV}"

      - name: Verify
        run: npm run verify

      - name: Verify Firestore rules
        run: npm run verify:rules

      - name: Deploy Firestore rules and indexes
        run: npm run firebase -- deploy --project "${FIREBASE_PROJECT_ID}" --only firestore:rules,firestore:indexes --non-interactive

      - name: Deploy Hosting
        run: npm run firebase -- deploy --project "${FIREBASE_PROJECT_ID}" --only hosting --non-interactive
